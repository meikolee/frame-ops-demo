# FRAME reverse proxy — drop into /etc/nginx/sites-available/frame
# Interview: upstreams, websocket-free static+API split, cache for HLS, gzip, log paths.

upstream frame_api {
    server 127.0.0.1:8787;
    keepalive 16;
}

upstream frame_web {
    server 127.0.0.1:3088;
    keepalive 16;
}

server {
    listen 80;
    server_name frame.example.com;

    access_log /var/log/nginx/frame.access.log;
    error_log  /var/log/nginx/frame.error.log warn;

    client_max_body_size 512m; # chunked uploads assemble server-side

    # Next.js App Router
    location / {
        proxy_pass http://frame_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NestJS API
    location /api/ {
        proxy_pass http://frame_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # HLS / media — short cache at edge; CDN would sit in front in prod
    location /media/ {
        proxy_pass http://frame_api;
        add_header Cache-Control "public, max-age=30";
        add_header Access-Control-Allow-Origin *;
    }
}
